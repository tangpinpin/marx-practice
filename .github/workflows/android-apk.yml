name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - 'index.html'
      - 'styles.css'
      - 'app.js'
      - 'questions.js'
      - 'manifest.json'
      - 'service-worker.js'
      - 'icon.svg'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the APK as a preview release
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: android-app/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Configure Android SDK
        shell: bash
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "$sdk_root/platform-tools" >> "$GITHUB_PATH"
          echo "$sdk_root/emulator" >> "$GITHUB_PATH"
          sdkmanager_path="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          if [ -z "$sdkmanager_path" ]; then
            echo "sdkmanager was not found under $sdk_root/cmdline-tools" >&2
            exit 1
          fi
          echo "$(dirname "$sdkmanager_path")" >> "$GITHUB_PATH"
          echo "Using $sdkmanager_path"
          yes | "$sdkmanager_path" --licenses >/dev/null || true
          "$sdkmanager_path" 'platforms;android-36' 'build-tools;36.0.0'
      - run: npm ci
      - run: npm run sync:web
      - run: node scripts/create-icons.mjs
      - run: chmod +x android/gradlew
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android-app/android
      - uses: actions/upload-artifact@v4
        with:
          name: marx-practice-debug-apk
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: marx-practice-debug-apk
          path: release
      - name: Publish preview APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv release/app-debug.apk release/marx-practice-android-preview.apk
          gh release create "android-preview-${{ github.run_number }}" release/marx-practice-android-preview.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "马原刷题 Android 预览版" \
            --notes "个人使用的 Android 调试版。安装前可在网页端导出进度；安卓端数据与网页端互不自动同步。此版使用临时调试签名，后续更新可能需要卸载重装，请先导出进度。" \
            --prerelease
