name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - 'index.html'
      - 'styles.css'
      - 'app.js'
      - 'questions.js'
      - 'manifest.json'
      - 'service-worker.js'
      - 'icon.svg'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: android-app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: npm ci
      - run: npm run sync:web
      - run: node scripts/create-icons.mjs
      - run: chmod +x android/gradlew
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android-app/android
      - uses: actions/upload-artifact@v4
        with:
          name: marx-practice-debug-apk
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
