<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#102a43" />
  <title>马原刷题</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar"><div><p class="eyebrow">马克思主义基本原理</p><h1>马原刷题</h1></div><button id="resetData" class="icon-button" title="清空本地记录" aria-label="清空本地记录">↺</button></header>
    <section id="homeView" class="view active">
      <div class="hero"><p class="kicker">按章节掌握重点</p><h2>今天从一个知识点开始</h2><p id="bankTotal" class="muted">题库加载中</p><button id="startPractice" class="primary">开始刷题 <span>→</span></button></div>
      <div class="stats"><div><strong id="attemptCount">0</strong><span>答题次数</span></div><div><strong id="uniqueCount">0</strong><span>做过题目</span></div><div><strong id="accuracy">0%</strong><span>首次正确率</span></div></div>
      <div class="stats secondary-stats"><div><strong id="mastery">0%</strong><span>掌握率</span></div><div><strong id="wrongCount">0</strong><span>待复习</span></div><div><strong id="feedbackCount">0</strong><span>题目反馈</span></div></div>
      <div id="chapterStats" class="chapter-results"></div>
      <button id="wrongPractice" class="secondary full">错题本 <span>→</span></button>
      <button id="continuePractice" class="secondary full hidden">继续上次练习 <span>→</span></button>
      <div class="data-tools"><button id="exportData" class="text-button">导出进度</button><label class="text-button import-label">导入进度<input id="importData" type="file" accept="application/json,.json"></label></div>
      <p class="notice">题目依据所选 PDF 整理，解析会标注原文页码。</p>
    </section>
    <section id="wrongView" class="view">
      <div class="section-head"><button class="back" data-back="homeView">←</button><div><p class="eyebrow">复习筛选</p><h2>错题本</h2></div></div>
      <div class="filter-group"><span>章节</span><div id="wrongChapters" class="filter-chips"></div></div>
      <div class="filter-group"><span>题型</span><div id="wrongTypes" class="filter-chips"><button data-type="single">单选</button><button data-type="multi">多选</button><button data-type="judge">判断</button></div></div>
      <div class="filter-group"><span>掌握状态</span><div class="filter-chips"><button data-mastery="all" class="active">全部</button><button data-mastery="unmastered">未掌握</button><button data-mastery="mastered">已掌握</button></div></div>
      <p id="wrongCountLabel" class="muted"></p><button id="startWrongFiltered" class="primary full">开始复习</button><button id="clearWrong" class="secondary full">清空错题记录</button>
    </section>
    <section id="selectView" class="view">
      <div class="section-head"><button class="back" data-back="homeView">←</button><div><p class="eyebrow">练习设置</p><h2>选择章节</h2></div></div>
      <div class="toolbar"><button id="selectAll" class="text-button">全选</button><button id="clearAll" class="text-button">清空</button><span id="selectedSummary" class="muted"></span></div>
      <div id="chapterList" class="chapter-list"></div>
      <div class="mode-row"><span>出题顺序</span><label><input type="radio" name="mode" value="random" checked /> 随机</label><label><input type="radio" name="mode" value="order" /> 顺序</label></div>
      <button id="beginSelected" class="primary full">开始练习</button>
    </section>
    <section id="quizView" class="view">
      <div class="section-head"><button id="quitQuiz" class="back">←</button><div><p id="quizMeta" class="eyebrow"></p><h2 id="quizProgress"></h2></div></div>
      <div class="progress"><i id="progressBar"></i></div><article class="question"><div id="typeBadge" class="badge"></div><h3 id="stem"></h3><div id="options" class="options"></div><div id="feedback" class="feedback hidden"></div><button id="markMastered" class="text-button hidden">标记为已掌握</button></article>
      <div class="quiz-actions"><button id="submitAnswer" class="primary full">提交答案</button><button id="nextQuestion" class="primary full hidden">下一题 <span>→</span></button></div>
    </section>
    <section id="resultView" class="view"><div class="section-head"><div><p class="eyebrow">本轮完成</p><h2>练习结果</h2></div></div><div class="result-score"><strong id="resultPercent">0%</strong><span id="resultLine"></span></div><div id="chapterResults" class="chapter-results"></div><button id="retryWrong" class="secondary full">重做本轮错题</button><button data-back="homeView" class="primary full">返回首页</button></section>
  </main>
  <script src="questions.js"></script><script src="app.js"></script>
</body>
</html>
